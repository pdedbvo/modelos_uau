<!doctype html>
<html lang="pt-BR">

<link rel="stylesheet" href="estilo.css">
</head>
<body>
<header class="topo">
  <div class="topo-in">

      <div class="eyebrow claro">Ferramentas DBVO</div>
      <h1>Modelos de lançamento</h1>
      <p class="sub">Gere o documento para anexar no UAU em poucos minutos.</p>

<main id="app" class="conteudo"></main>

</html>
